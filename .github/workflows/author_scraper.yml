name: 24/7 Author Lead Scraper (USA & Canada)

on:
  schedule:
    # Runs automatically in the cloud every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Author Lead Mining Engine (50 Min Cycle)
        env:
          NODE_ENV: production
          MAX_RUN_MINUTES: 50
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node start_author_scraper.js

      - name: Commit & Push Updated Author Leads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "output/"
          git commit -m "Auto-update author leads spreadsheet [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Master Excel Spreadsheet
        uses: actions/upload-artifact@v4
        with:
          name: Authors_USA_Canada_Master_Excel
          path: "output/Authors_USA_Canada_Master.xlsx"
          if-no-files-found: warn
